services:
  geoworld-db:
    container_name: geoworld_db
    image: postgres:17
    ports:
      - "5432:5432"
    volumes:
      - ./db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=geoworld
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=geoworld
      - TZ=Etc/UTC
    restart: always

  geoworld-game:
    container_name: geoworld_game
    image: geoworld
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_URL=http://localhost:3000
      - POSTGRES_URL=
      - DISCORD_CLIENT_ID=
      - DISCORD_CLIENT_SECRET=
    restart: always
